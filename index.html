<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Admit Pal</title>
<style>
@font-face{font-family:"Jakarta";src:url("font/PlusJakartaSans.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{
  --ink:#222222; --ink2:#484848; --sub:#6A6A6A; --faint:#B0B0B0; --line:#EBEBEB; --wash:#F7F7F7; --white:#fff;
  --brand:#800000; --brand2:#B3123C; --grad:linear-gradient(90deg,#B3123C 0%,#9A0F2E 45%,#800000 100%);
  --dream:#8E1B3C; --dream-bg:#FBEFF2; --target:#34457A; --target-bg:#EEF1F8; --safe:#0F7B6C; --safe-bg:#E9F6F3;
  --gold:#F1C400; --warn:#B4540A; --warn-bg:#FFF6EC;
  --r:16px; --shadow:0 6px 20px rgba(0,0,0,.08); --shadow2:0 2px 8px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.1);
  --font:"Jakarta","Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.5 var(--font);color:var(--ink);background:#ECEAE6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
svg{display:block}

/* stage */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px}
.phone{width:390px;height:844px;border-radius:56px;background:#111;padding:11px;box-shadow:0 40px 80px rgba(0,0,0,.25),inset 0 0 0 2px #333;flex:none;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#fff;display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;border-radius:20px;background:#000;z-index:80}
.status{position:absolute;top:0;left:0;right:0;height:52px;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 36px;font-size:15px;font-weight:600;pointer-events:none}
.status.light{color:#fff}
.status .sig{display:flex;gap:6px;align-items:center}
.status .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.9;position:relative}
.status .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.view{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:0 24px}
.top-gap{height:58px;flex:none}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:90;opacity:.85}

/* type */
.h1{font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.025em}
.h2{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.h3{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.p{font-size:15px;line-height:1.5;color:var(--sub)}
.cap{font-size:13px;line-height:1.4;color:var(--sub)}
.link{font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* buttons */
.btn{height:54px;width:100%;border-radius:12px;background:var(--grad);color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#DDDDDD;color:#fff;cursor:not-allowed}
.btn.dark{background:var(--ink)}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.soft{background:#fff;color:var(--ink);border:1px solid #DDD}
.btn.auto{width:auto;padding:0 24px}
.btn svg{width:20px;height:20px}
.circle-btn{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.1);flex:none}
.circle-btn svg{width:16px;height:16px}
.circle-btn.flat{box-shadow:none;border:1px solid var(--line)}

/* welcome */
.welcome{flex:1;display:flex;flex-direction:column;padding:62px 24px 34px}
.arch{flex:1;min-height:0;border-radius:180px 180px 28px 28px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.arch svg{width:100%;height:100%}
.arch .float{position:absolute;left:16px;bottom:16px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:rise .8s .4s both}
.arch .float b{display:block;font-size:13px;font-weight:600}
.arch .float span{font-size:12px;color:var(--sub)}
.arch .float i{width:32px;height:32px;border-radius:50%;background:var(--target-bg);color:var(--target);display:grid;place-items:center}
.arch .float i svg{width:17px;height:17px}
.wm{display:flex;align-items:center;gap:10px;margin-top:26px}
.logo{width:34px;height:34px;flex:none}
.wm span{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--brand)}
.welcome .h1{margin-top:12px;font-size:32px}
.welcome .p{margin-top:10px}
.welcome .acts{margin-top:24px;display:flex;flex-direction:column;gap:12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:92%;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet-hd{height:60px;flex:none;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:0 16px;border-bottom:1px solid var(--line)}
.sheet-hd h3{text-align:center;font-size:16px;font-weight:700}
.sheet-hd .x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.sheet-hd .x:hover{background:var(--wash)}
.sheet-hd .x svg{width:16px;height:16px}
.sheet-body{padding:22px 24px 30px;overflow-y:auto}
.or{display:flex;align-items:center;gap:14px;margin:18px 0;font-size:12px;color:var(--sub)}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.dialog{margin:auto 28px;background:#fff;border-radius:24px;padding:28px 24px 22px;text-align:center;animation:up .25s}
.dialog .ico{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--wash);display:grid;place-items:center;color:var(--ink)}
.dialog .ico svg{width:26px;height:26px}
.dialog .p{margin:8px 0 20px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}

/* fields */
.fieldset{border:1px solid #B0B0B0;border-radius:12px;overflow:hidden}
.fld{position:relative;display:block}
.fld+.fld{border-top:1px solid #B0B0B0}
.fld span{position:absolute;left:14px;top:9px;font-size:12px;color:var(--sub)}
.fld input{width:100%;height:58px;border:0;padding:22px 14px 6px;font-size:16px;background:transparent;outline:none}
.fld:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.err{font-size:13px;color:#C13515;margin-top:8px;display:flex;gap:6px;align-items:center}
.err:empty{display:none}
.big-input{width:100%;border:0;border-bottom:2px solid var(--line);font-size:40px;font-weight:600;letter-spacing:-.02em;padding:8px 0;outline:none;background:transparent}
.big-input:focus{border-color:var(--ink)}
.big-input::placeholder{color:#D3D3D3}
.big-input.bad{border-color:#C13515}
.seg{display:inline-flex;background:var(--wash);border-radius:24px;padding:4px;gap:2px}
.seg button{height:38px;padding:0 18px;border-radius:20px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.counter{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line)}
.counter .ctl{display:flex;align-items:center;gap:16px}
.counter .ctl button{width:36px;height:36px;border-radius:50%;border:1px solid #B0B0B0;display:grid;place-items:center;color:var(--ink2)}
.counter .ctl button:disabled{opacity:.3;cursor:not-allowed}
.counter .ctl button svg{width:15px;height:15px}
.counter .ctl b{min-width:44px;text-align:center;font-size:17px;font-weight:600}
.counter .ctl b.unset{color:var(--faint);font-weight:500;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{border:1px solid #DDDDDD;border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:92px;transition:border-color .15s,background .15s}
.tile svg{width:26px;height:26px}
.tile span{font-size:14px;font-weight:600;line-height:1.25}
.tile[aria-pressed=true]{border:2px solid var(--ink);background:var(--wash);padding:13px}

/* onboarding */
.ob{flex:1;display:flex;flex-direction:column;min-height:0}
.ob .scroll{padding:8px 24px 24px}
.ob-top{height:104px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 14px}
.ob-top .exit{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:18px;height:34px;padding:0 14px}
.ob-step{font-size:13px;font-weight:600;color:var(--sub)}
.ob h1{margin-top:6px}
.ob .p{margin-top:10px;max-width:34ch}
.ob-body{margin-top:30px}
.ob-foot{flex:none;padding:0 24px 30px;background:#fff}
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.prog i.on:after{content:"";position:absolute;inset:0;background:var(--ink);animation:grow .4s ease-out both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.ob-foot .row{display:flex;justify-content:space-between;align-items:center}
.ob-foot .btn{width:auto;min-width:120px;padding:0 26px;height:50px;font-size:15px}
.skip-link{margin-top:22px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}

/* tab bar */
.tabs{flex:none;height:84px;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 10px 26px;background:#fff}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#717171;flex:1;min-width:0}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=true]{color:var(--brand)}

/* home */
.hello{display:flex;justify-content:space-between;align-items:center;padding:4px 24px 0}
.hello .cap{font-weight:500}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center;flex:none}
.avatar svg{width:22px;height:22px}
.hero{margin:22px 24px 0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow2);background:#fff}
.hero .art{height:170px;position:relative}
.hero .art svg{width:100%;height:100%}
.hero .art .tag{position:absolute;top:14px;left:14px;background:#fff;border-radius:14px;height:28px;padding:0 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero .art .tag svg{width:14px;height:14px;color:var(--brand)}
.hero .body{padding:18px 20px 20px}
.hero .body .p{margin:6px 0 16px}
.strength{margin:18px 24px 0;padding:16px 18px;border-radius:16px;border:1px solid var(--line);display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 48px)}
.ringchart{width:46px;height:46px;flex:none}
.strength .t{flex:1;display:block;min-width:0}
.strength>svg:last-child{width:18px;height:18px;flex:none;color:var(--ink2)}
.strength .t b{display:block;font-size:15px;font-weight:600}
.statrow{margin:18px 24px 0;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px}
.statrow div{padding:14px 8px;text-align:center}
.statrow div+div{border-left:1px solid var(--line)}
.statrow b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.statrow span{font-size:12px;color:var(--sub)}
.sect{padding:30px 24px 0}
.rows{margin-top:6px}
.rowbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line)}
.rowbtn:last-child{border-bottom:0}
.rowbtn .ico{width:46px;height:46px;border-radius:12px;background:var(--wash);display:grid;place-items:center;flex:none}
.rowbtn .ico svg{width:22px;height:22px}
.rowbtn .t{flex:1;min-width:0}
.rowbtn .t b{display:block;font-weight:600;font-size:15px}
.rowbtn .t span{font-size:13px;color:var(--sub)}
.rowbtn .chev{width:18px;height:18px;color:var(--ink2);flex:none}
.soon{font-size:11px;font-weight:700;background:var(--wash);border-radius:10px;padding:3px 9px;color:var(--sub);flex:none}
.rowbtn.off .ico{color:var(--faint)}
.rowbtn.off .t b{color:var(--sub)}

/* assess */
.nav{height:104px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 10px}
.searchpill{margin:14px 24px 0;height:56px;border-radius:28px;box-shadow:0 3px 12px rgba(0,0,0,.1);border:1px solid #EBEBEB;display:flex;align-items:center;gap:12px;padding:0 20px}
.searchpill svg{width:20px;height:20px;flex:none}
.searchpill input{flex:1;border:0;outline:none;font-size:15px;font-weight:500;background:transparent;min-width:0}
.searchpill input::placeholder{color:var(--ink2)}
.searchpill .clr{width:26px;height:26px;border-radius:50%;background:var(--wash);display:grid;place-items:center}
.searchpill .clr svg{width:12px;height:12px}
.chips{display:flex;gap:8px;padding:16px 24px 0;overflow-x:auto}
.chips::-webkit-scrollbar{height:0}
.chip{height:36px;padding:0 16px;border-radius:18px;border:1px solid #DDDDDD;font-size:13px;font-weight:600;white-space:nowrap;flex:none;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.dis{color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;padding:16px 24px 0}
.card{text-align:left;display:flex;flex-direction:column;gap:9px}
.card .img{position:relative;aspect-ratio:1/1.02;border-radius:14px;overflow:hidden;transition:box-shadow .15s}
.card .img svg.scene{width:100%;height:100%}
.card .fit{position:absolute;top:10px;left:10px;height:24px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.95);font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card .fit:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.card .fit.dream{color:var(--dream)} .card .fit.target{color:var(--target)} .card .fit.safe{color:var(--safe)}
.card .mono{position:absolute;left:10px;bottom:10px;height:24px;padding:0 9px;border-radius:12px;background:rgba(255,255,255,.95);font-size:11px;font-weight:700;display:flex;align-items:center;letter-spacing:.02em}
.card .add{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .15s,background .15s}
.card .add svg{width:16px;height:16px}
.card[aria-pressed=true] .add{background:var(--brand);color:#fff;transform:scale(1.08)}
.card[aria-pressed=true] .img{box-shadow:0 0 0 3px var(--ink)}
.card .nm{font-size:14px;font-weight:600;line-height:1.25}
.card .meta{font-size:13px;color:var(--sub);line-height:1.35;margin-top:-6px}
.more{display:flex;justify-content:center;padding:26px 24px 0}
.empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--sub);font-size:14px}
.empty svg{width:34px;height:34px;margin:0 auto 10px;color:var(--faint)}
.dock{flex:none;border-top:1px solid var(--line);padding:14px 24px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff}
.dock .cnt b{display:block;font-size:16px;font-weight:700}
.dock .cnt button{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:2px;color:var(--ink2)}
.dock .btn{width:auto;padding:0 26px}

/* analysing */
.analyse{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px 60px}
.pulse{width:72px;height:72px;margin-bottom:30px;position:relative}
.pulse i{position:absolute;inset:0;border-radius:50%;background:var(--grad);animation:pulse 1.6s ease-out infinite}
.pulse i:nth-child(2){animation-delay:.5s}
.pulse b{position:absolute;inset:14px;border-radius:50%;background:var(--grad);box-shadow:0 6px 18px rgba(128,0,0,.35)}
@keyframes pulse{from{transform:scale(.6);opacity:.5}to{transform:scale(1.6);opacity:0}}
.steps{margin-top:26px;display:flex;flex-direction:column;gap:16px}
.step{display:flex;gap:14px;align-items:center;font-size:15px;color:var(--faint);font-weight:500;transition:color .3s}
.step i{width:26px;height:26px;border-radius:50%;border:1.5px solid #DDD;display:grid;place-items:center;flex:none}
.step i svg{width:13px;height:13px}
.step.now{color:var(--ink)}
.step.now i{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--ink)}
.step.done i{background:var(--ink);border-color:var(--ink);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* results */
.res-top{height:104px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 10px}
.pillbtn{height:36px;padding:0 16px;border-radius:18px;border:1px solid #DDD;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pillbtn svg{width:15px;height:15px}
.summary{margin:18px 24px 0;border-radius:20px;box-shadow:var(--shadow2);overflow:hidden}
.summary .read{padding:18px 18px 16px;display:flex;gap:12px}
.summary .read .sp{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.summary .read .sp svg{width:16px;height:16px}
.summary .read b{font-size:12px;font-weight:700;color:var(--brand);display:block;margin-bottom:2px}
.summary .read p{font-size:14px;line-height:1.45;color:var(--ink2)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.counts button{padding:14px 6px 13px;text-align:center}
.counts button+button{border-left:1px solid var(--line)}
.counts b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.counts span{font-size:12px;font-weight:600}
.counts .dream{color:var(--dream)} .counts .target{color:var(--target)} .counts .safe{color:var(--safe)}
.note{margin:16px 24px 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13px;line-height:1.45;display:flex;gap:10px}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.why{margin:16px 24px 0;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.why svg{width:16px;height:16px}
.bucket{padding:28px 24px 0}
.bucket-hd{display:flex;gap:12px;align-items:center}
.bucket-hd .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.bucket-hd .bi svg{width:20px;height:20px}
.bucket.dream .bi{background:var(--dream-bg);color:var(--dream)} .bucket.target .bi{background:var(--target-bg);color:var(--target)} .bucket.safe .bi{background:var(--safe-bg);color:var(--safe)}
.bucket-hd .cap{margin-top:1px}
.sch{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.sch:last-child{border-bottom:0}
.sch .th{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:none}
.sch .th svg{width:100%;height:100%}
.sch .t{flex:1;min-width:0}
.sch .t b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch .t span{font-size:13px;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.sch .pc{text-align:right;flex:none}
.sch .pc b{font-size:18px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.sch .pc span{font-size:11px;color:var(--sub)}

}

/* ===================== simulated AI: fit model ===================== */
/* Preferences from the profile. Legacy adds fit_rules.legacy_bonus at that one school; budget and focus
   only reorder suggestions and add advice, they never change a chance. */
const isLegacy = (s, p) => p.legacy === 'yes' && p.legacySchool === s.id;
const tuiMax = p => { const t = SIM.tuition_ranges.find(x => x.id === p.tuition); return t && t.max && p.sponsor !== 'yes' ? t.max : null; };
const overBudget = (s, p) => { const m = tuiMax(p); return m !== null && s.tuition > m; };
const focusHit = (s, p) => (p.focus || []).filter(f => s.focus.includes(f));
const money = n => '$' + Math.round(n / 1000) + 'k';
const labelsOf = (list, ids) => ids.map(id => (list.find(x => x.id === id) || {}).label).filter(Boolean).map(l => l.toLowerCase()).join(' and ');
function norm(p){
  const R = SIM.fit_rules; let gmat = num(p.score);
  if (gmat !== null && p.test === 'gre') gmat = Math.round(R.gre_to_gmat_focus.slope * gmat + R.gre_to_gmat_focus.intercept);
  const g = num(p.gpa); const gpa4 = g === null ? null : (p.gpaScale === '10' ? +(g * R.gpa10_to_gpa4_factor).toFixed(2) : g);
  return { gmat, gpa4, years: num(p.years), industry: p.industry || '' };
}
function chance(s, p){
  const R = SIM.fit_rules, n = norm(p); let c = s.base + (S.calib || 0);
  if (n.gmat !== null) c += (n.gmat - s.gmat) / 10 * R.gmat_points_per_10;
  if (n.gpa4 !== null) c += (n.gpa4 - s.gpa) / 0.1 * R.gpa_points_per_0_1;
  if (n.years !== null){
    if (n.years < R.workex_ideal_min) c += R.workex_low_penalty;
    else if (n.years <= R.workex_ideal_max) c += R.workex_ideal_bonus;
    else if (n.years >= R.workex_high_from) c += R.workex_high_penalty;
  }
  if (isLegacy(s, p)) c += R.legacy_bonus;
  return Math.round(Math.min(R.max_chance, Math.max(R.min_chance, c)));
}
/* ===== Scenario 2 (verification): how much evidence backs each estimate =====
   support = similar past applicants at this school x profile multipliers (scenarios.confidence).
   Below the threshold the output is low confidence: wider range, tier capped at Target. */
function confidence(s, p){
  const C = SIM.scenarios.confidence, M = C.multipliers, n = norm(p), me = S.comm && S.comm.me;
  let m = 1; const why = [];
  if (p.gpaScale === '10' || (me && me.country && me.country !== 'United States')) { m *= M.international; why.push('international'); }
  if (n.industry === 'nonprofit') { m *= M.nonprofit; why.push('nonprofit'); } else if (n.industry === 'other') { m *= M.other; why.push('less common industry'); }
  if (n.gmat === null) { m *= M.missing_test; why.push('no test score'); }
  if (n.gpa4 === null) { m *= M.missing_gpa; why.push('no GPA'); }
  const k = Math.max(3, Math.round(s.support * m)), low = k < C.low_support_threshold, c = chance(s, p), r = low ? C.range_low : C.range_normal;
  return { k, low, why, lo: Math.max(1, c - r), hi: Math.min(97, c + r) };
}
function tierOf(s, p){
  const c = chance(s, p), b = bucketOf(c), cf = confidence(s, p);
  if (cf.low && b.id === 'safe') return { b: SIM.buckets.find(x => x.id === 'target'), capped: true, c, cf };
  return { b, capped: false, c, cf };
}
function drivers(s, p){
  const R = SIM.fit_rules, n = norm(p), out = [];
  if (n.gmat !== null){ const v = Math.round((n.gmat - s.gmat) / 10 * R.gmat_points_per_10); out.push({icon:'quant', label:`GMAT ${n.gmat} vs median ${s.gmat}`, v}); } else out.push({icon:'quant', label:'No test score, median assumed', v:null});
  if (n.gpa4 !== null){ const v = Math.round((n.gpa4 - s.gpa) / 0.1 * R.gpa_points_per_0_1); out.push({icon:'cap', label:`GPA ${n.gpa4} vs median ${s.gpa.toFixed(1)} (4.0 scale)`, v}); } else out.push({icon:'cap', label:'No GPA, median assumed', v:null});
  if (n.years !== null){ const v = n.years < R.workex_ideal_min ? R.workex_low_penalty : n.years <= R.workex_ideal_max ? R.workex_ideal_bonus : n.years >= R.workex_high_from ? R.workex_high_penalty : 0; out.push({icon:'briefcase', label:`${n.years} years of experience vs about ${s.we}`, v}); }
  if (isLegacy(s, p)) out.push({icon:'users', label:'Legacy candidate', v:R.legacy_bonus});
  return out;
}
const missing = p => { const n = norm(p), m = []; if (n.gmat === null) m.push('test score'); if (n.gpa4 === null) m.push('GPA'); if (n.years === null) m.push('work experience'); if (!p.industry) m.push('industry'); return m; };
const isEstimate = p => { const n = norm(p); return n.gmat === null || n.gpa4 === null || n.years === null; };
const bucketOf = c => SIM.buckets.find(b => c >= b.min && c <= b.max);
const inProgram = s => S.program === 'all' || s.format === S.program;
/* Suggest a balanced list: in each bucket, the schools whose chance sits closest to that bucket's
   target point (set in fit_rules.suggest_targets). If a bucket is short, top up from the others. */
function suggested(){
  const R = SIM.fit_rules, per = R.suggest_per_bucket, T = R.suggest_targets;
  const all = SIM.schools.filter(inProgram).map(s => ({id:s.id, c:chance(s, S.profile)}));
  const near = (arr, t) => arr.sort((a,b) => (Math.abs(a.c-t) + a.adj) - (Math.abs(b.c-t) + b.adj));
  let pick = [];
  all.forEach(x => { const sc = school(x.id), t = tierOf(sc, S.profile); x.b = t.b.id; x.low = t.cf.low; x.adj = (overBudget(sc, S.profile) ? R.over_budget_penalty : 0) - (focusHit(sc, S.profile).length ? R.focus_match_bonus : 0); });
  SIM.buckets.forEach(b => { const inB = all.filter(x => x.b === b.id); pick.push(...near(inB.filter(x => !x.low), T[b.id]).slice(0, per)); if (pick.filter(x => x.b === b.id).length < per) pick.push(...near(inB.filter(x => x.low && !pick.includes(x)), T[b.id]).slice(0, per - pick.filter(x => x.b === b.id).length)); });
  const rest = near(all.filter(x => !pick.includes(x)), T.target);
  return [...pick, ...rest].slice(0, R.suggest_count).sort((a,b) => a.c - b.c).map(x => x.id);
}
function basisText(){
  const p = S.profile, n = norm(p), ind = SIM.industries.find(i => i.id === p.industry), bits = [];
  if (n.gmat !== null) bits.push(`${n.gmat} GMAT${p.test==='gre'?' equivalent':''}`);
  if (n.years !== null) bits.push(`${n.years} year${n.years===1?'':'s'}${ind ? ' in ' + ind.label.toLowerCase() : ' of experience'}`);
  else if (n.gpa4 !== null) bits.push(`${p.gpa}${p.gpaScale==='10'?'/10':''} GPA`);
  return bits.join(' and ');
}
function runAssessment(){
  const out = { dream:[], target:[], safe:[] };
  S.selected.forEach(id => { const t = tierOf(school(id), S.profile); out[t.b.id].push({id, c:t.c, low:t.cf.low, capped:t.capped, lo:t.cf.lo, hi:t.cf.hi, k:t.cf.k}); });
  Object.values(out).forEach(a => a.sort((x,y) => y.c - x.c));
  const capped = out.target.filter(x => x.capped).length;
  const tag = !out.safe.length && capped ? 'lowconf_safe' : !out.safe.length ? 'no_safe' : !out.dream.length ? 'no_dream' : !out.target.length ? 'no_target' : 'balanced';
  const summary = (SIM.list_summary.find(x => x.when === tag) || SIM.list_summary.at(-1)).text;
  S.results = {...out, summary};
  log('ai', 'School list bucketed', Object.fromEntries(Object.entries(out).map(([k,v]) => [k, v.map(x => `${school(x.id).short} ${x.c}%`).join(', ') || 'none'])));
  log('ai', 'List summary', summary);
  if (isEstimate(S.profile)) log('ai', 'Low confidence flag', 'Profile incomplete, chances assume median values');
  Object.values(out).flat().filter(x => x.low).forEach(x => log('ai', 'Low confidence flag', `${school(x.id).short}: ${x.c}% (range ${x.lo} to ${x.hi}%), ${x.k} similar past applicants${x.capped ? ', tier capped at Target' : ''}`));
  buildPlan();
}

/* ===================== simulated AI: advice ===================== */
function adviceFor(id){
  const s = school(id), p = S.profile, n = norm(p), R = SIM.fit_rules, A = SIM.advice_rules, tags = new Set();
  if (n.gmat === null) tags.add('gmat_missing'); else { const d = n.gmat - s.gmat; tags.add(d >= R.near_median_band ? 'gmat_above' : d <= -R.near_median_band ? 'gmat_below' : 'gmat_near'); }
  if (n.gpa4 !== null) tags.add(n.gpa4 >= s.gpa ? 'gpa_above' : 'gpa_below');
  if (n.years !== null) tags.add(n.years < R.workex_ideal_min ? 'workex_low' : n.years <= R.workex_ideal_max ? 'workex_ideal' : n.years >= R.workex_high_from ? 'workex_high' : 'workex_ok');
  if (n.industry) tags.add('industry_' + n.industry);
  const fh = focusHit(s, p), want = p.focus || [], bud = SIM.tuition_ranges.find(x => x.id === p.tuition);
  if (fh.length) tags.add('focus_match'); else if (want.length) tags.add('focus_no_match');
  if (p.sponsor === 'yes') tags.add('sponsored'); else if (tuiMax(p) !== null) tags.add(overBudget(s, p) ? 'over_budget' : 'within_budget');
  if (isLegacy(s, p)) tags.add('legacy_here');
  if (p.goal && p.goal !== 'unsure') tags.add('goal_' + p.goal);
  const ind = SIM.industries.find(i => i.id === n.industry);
  const gpaTxt = n.gpa4 === null ? '' : (p.gpaScale === '10' ? `${p.gpa}/10 (about ${n.gpa4} on a 4.0 scale)` : `${n.gpa4}`);
  const v = { name:p.name, school:s.name, short:s.short, gmat:n.gmat, median:s.gmat, gmatDiff: n.gmat===null?'':Math.abs(n.gmat - s.gmat), gpa:gpaTxt, gpaMedian:s.gpa.toFixed(1), years:n.years, weMedian:s.we, industry: ind ? ind.label : '',
    focus:labelsOf(SIM.focus_areas, fh), focusWanted:labelsOf(SIM.focus_areas, want), tuition:money(s.tuition), budget: bud ? bud.label : '', industryFrom: ind && ind.id !== 'other' ? ind.label.toLowerCase() : 'your current work' };
  const pick = list => list.filter(r => tags.has(r.when)).map(r => ({icon:r.icon, label:r.label, text:fill(r.text, v)}));
  const strengths = pick(A.strengths);
  let weaknesses = pick(A.weaknesses); if (!weaknesses.length) weaknesses = [{...A.weakness_fallback, text: fill(A.weakness_fallback.text, v)}];
  const opportunities = [...s.opportunities.map(t => ({icon:'compass', label:'Make the case for ' + s.short, text:fill(t, v)})), ...pick(A.opportunities)];
  return { strengths, weaknesses, opportunities, tags:[...tags] };
}

function readStep(id, d){
  const set = (k, msg) => { const e = $('#e-'+k); if (e) e.innerHTML = msg ? ic('info')+msg : ''; const i = $('#q-'+k); if (i) i.classList.toggle('bad', !!msg); return !msg; };
  if (id === 'name') { d.name = $('#q-name').value.trim(); return true; }
  if (id === 'test') { d.score = $('#q-score').value.trim(); const v = num(d.score), [lo,hi] = d.test==='gre'?[260,340]:[205,805]; return set('score', d.score && (v===null||v<lo||v>hi) ? `Enter a score from ${lo} to ${hi}, or skip for now.` : ''); }
  if (id === 'gpa') { d.gpa = $('#q-gpa').value.trim(); const v = num(d.gpa), mx = d.gpaScale==='10'?10:4; return set('gpa', d.gpa && (v===null||v<0||v>mx) ? `Enter a GPA from 0 to ${mx}, or skip for now.` : ''); }
  return true;
}
function bindStep(id, d, rerender){
  const root = $('#overlay') || V();

  root.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => { if (d.gpaScale !== b.dataset.scale){ d.gpaScale = b.dataset.scale; d.gpa=''; rerender(); } });
  root.querySelectorAll('[data-yr]').forEach(b => b.onclick = () => { const cur = num(d.years); d.years = String(Math.max(0, Math.min(30, (cur ?? 0) + +b.dataset.yr))); rerender(); });
  root.querySelectorAll('[data-ind]').forEach(b => b.onclick = () => { d.industry = d.industry === b.dataset.ind ? '' : b.dataset.ind; rerender(); });
  root.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => { const f = b.dataset.focus, cur = d.focus || []; d.focus = cur.includes(f) ? cur.filter(x => x !== f) : [...cur, f]; rerender(); });
  root.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { d.goal = d.goal === b.dataset.goal ? '' : b.dataset.goal; rerender(); });
  root.querySelectorAll('[data-tui]').forEach(b => b.onclick = () => { d.tuition = d.tuition === b.dataset.tui ? '' : b.dataset.tui; rerender(); });
  root.querySelectorAll('[data-yn]').forEach(b => b.onclick = () => { const k = b.dataset.yn; d[k] = d[k] === b.dataset.v ? '' : b.dataset.v; if (k === 'legacy' && d.legacy !== 'yes') d.legacySchool = ''; rerender(); });
  const ls = root.querySelector('#q-legacy'); if (ls) ls.onchange = () => { d.legacySchool = ls.value; };
  const rf = root.querySelector('#q-resume'); if (rf) { root.querySelector('#q-resume-btn').onclick = () => rf.click();
    rf.onchange = () => { const f = rf.files[0]; if (!f) return; d.resume = f.name; log('user','Uploaded resume', f.name); log('ai','Resume read', SIM.resume.facts.join('; ')); rerender(); }; }
  const inp = root.querySelector('.big-input'); if (inp) inp.addEventListener('input', () => { const btn = $('#ob-next'); if (btn) btn.textContent = nextLabel(id, {...d, [id==='name'?'name':id==='test'?'score':'gpa']: inp.value.trim()}); });
}

function listCheck(){
  const L = SIM.scenarios.list_check, sel = S.selected.map(id => ({id, t:tierOf(school(id), S.profile)}));
  const cnt = {dream:0, target:0, safe:0}; sel.forEach(x => cnt[x.t.b.id]++);
  const allDream = sel.length >= 2 && cnt.dream === sel.length, noLikely = sel.length >= 2 && cnt.safe === 0;
  if (!allDream && !noLikely) return false;
  const pool = suggested().filter(id => !S.selected.includes(id)).map(id => ({id, t:tierOf(school(id), S.profile)}));
  /* Likely candidates: schools whose raw chance is 60%+, preferring ones with enough data. If every one is
     low confidence, still offer the closest, shown honestly as "held at Target". */
  const likelyPool = SIM.schools.filter(sc => inProgram(sc) && !S.selected.includes(sc.id)).map(sc => ({id:sc.id, t:tierOf(sc, S.profile)}))
    .filter(x => bucketOf(x.t.c).id === 'safe').sort((a,b) => (a.t.cf.low - b.t.cf.low) || Math.abs(a.t.c-70) - Math.abs(b.t.c-70));
  const need = [];
  likelyPool.slice(0, allDream ? 1 : 2).forEach(x => need.push(x));
  const take = n => pool.filter(x => x.t.b.id === 'target' && !x.t.capped && !need.some(y => y.id === x.id)).sort((a,b) => (a.t.cf.low - b.t.cf.low)).slice(0, n).forEach(x => need.push(x));
  take(L.max_add - need.length);
  const recs = need.slice(0, L.max_add), on = new Set(recs.map(x => x.id));
  const kind = allDream ? 'all_dream' : 'no_likely';
  log('ai','List check triggered', `${kind}: ${cnt.dream} Dream, ${cnt.target} Target, ${cnt.safe} Likely. Suggested ${recs.map(x => school(x.id).short + ' (' + x.t.b.label + ' ' + x.t.c + '%)').join(', ')}`);
  const draw = () => {
    const n = sel.length, k = on.size, gm = norm(S.profile).gmat;
    overlay(`<div class="sheet" role="dialog" aria-label="List check">${sheetHd('Before we build your list')}<div class="sheet-body">
      <div class="lc-icon">${ic('flag',2)}</div>
      <h2 class="h2" style="font-size:21px">${esc(fill(allDream ? L.all_dream_title : L.no_likely_title, {n}))}</h2>
      <p class="p" style="margin-top:6px">${esc(allDream ? L.body_all_dream : L.body_no_likely)}</p>
      <div class="mix">${['dream','target','safe'].map(id => `<div class="${id}" style="flex:${Math.max(cnt[id],.0001)}"></div>`).join('')}</div>
      <div class="mixlbl">${SIM.buckets.map(b => `<span class="${b.id}"><i></i>${cnt[b.id]} ${b.label}</span>`).join('')}</div>
      ${recs.length ? `<div class="h3" style="margin-top:22px">${esc(L.suggest_title)}</div><p class="cap">${esc(L.suggest_sub)}</p>
      <div class="lc-list">${recs.map(x => { const sc = school(x.id), d = gm === null ? null : gm - sc.gmat; return `<button class="lc-row" data-lc="${x.id}" aria-pressed="${on.has(x.id)}"><span class="th">${schoolArt(sc)}</span><span class="t"><b>${esc(sc.name)}</b><span>${x.t.capped ? `<em class="tg2 target">Target, ~${x.t.c}%</em><em class="lowtag" style="margin-right:4px">${ic('info',2.4)}low confidence</em>` : `<em class="tg2 ${x.t.b.id}">${x.t.b.label}, ${x.t.c}%</em>`} ${d===null ? 'Median GMAT ' + sc.gmat : d===0 ? `Median GMAT ${sc.gmat}, you at median` : `Median GMAT ${sc.gmat}, you ${d>0?'+':''}${d}`}</span></span><span class="cbx">${ic('check',3)}</span></button>`; }).join('')}</div>` : ''}
      <button class="btn" id="lc-add" style="margin-top:20px" ${k?'':'disabled'}>${esc(fill(L.add_cta, {k}))}</button>
      <button class="btn soft" id="lc-keep" style="margin-top:10px">${esc(L.keep_cta)}</button>
      <button class="link" id="lc-edit" style="display:block;margin:16px auto 0;font-size:14px">${esc(L.edit_cta)}</button></div></div>`);
    document.querySelectorAll('[data-lc]').forEach(b => b.onclick = () => { on.has(b.dataset.lc) ? on.delete(b.dataset.lc) : on.add(b.dataset.lc); log('user', on.has(b.dataset.lc) ? 'Ticked suggestion' : 'Unticked suggestion', school(b.dataset.lc).short); draw(); });
    $('#lc-add').onclick = () => { const add = [...on]; S.selected = [...S.selected, ...add]; log('user','Accepted list check', 'Added ' + add.map(id => school(id).short).join(', ')); log('data','List check outcome', {kind, action:'accepted', added:add.length}); closeOverlay(); startAssessment(); };
    $('#lc-keep').onclick = () => { log('user','Overrode list check','Kept original list'); log('data','List check outcome', {kind, action:'overridden', added:0}); closeOverlay(); startAssessment(); };
    $('#lc-edit').onclick = () => { log('user','Went back to edit after list check',''); log('data','List check outcome', {kind, action:'edit'}); closeOverlay(); };
  };
  draw(); return true;
}

function recordOutcomes(next, share){
  const O = SIM.outcomes, F = O.feedback, changed = Object.keys(next).filter(id => next[id] !== outcomeOf(id));
  if (!changed.length) { closeOverlay(); toast('No changes to save', 'info'); return; }
  const miss = [], beat = [];
  changed.forEach(id => {
    const sc = school(id), t = tierOf(sc, S.profile), o = next[id];
    if (o === 'submitted') log('data','Application status updated', {school:sc.short, status:o});
    else log('data','Outcome reported (training label)', {school:sc.short, predicted:t.c + '%', tier:t.b.label + (t.capped?' (capped)':''), outcome:o, support:t.cf.k});
    if (o === 'noinvite' && t.c >= 45) miss.push({id, c:t.c});
    if ((o === 'invite' || o === 'admit') && t.c < 30) beat.push({id, c:t.c});
    if (share && TRACKED.includes(o)) { const c = comm(); c.outcomes++; const tr = c.threads.find(x => x.school === id && x.tracker); if (tr){ const k = o === 'noinvite' ? 'noinvite' : 'invites'; tr.tracker[k]++; } }
  });
  S.outcomes = {...S.outcomes, ...next};
  const planMsgs = changed.map(id => planStatus(id, next[id])).filter(Boolean);
  if (changed.every(id => next[id] === 'submitted')) { closeOverlay(); render(); toast(esc(planMsgs[0] || 'Saved'), 'check'); return; }
  if (share) log('data','Shared to live trackers', changed.filter(id => TRACKED.includes(next[id])).map(id => school(id).short).join(', ') || 'none');
  const kind = miss.length ? 'miss' : beat.length ? 'beat' : 'match', fb = F[kind], step = O.calib_step;
  const before = S.calib || 0;
  if (kind === 'miss') S.calib = Math.max(-O.calib_max, before - step);
  if (kind === 'beat') S.calib = Math.min(O.calib_max, before + step);
  if (S.calib !== before) { log('ai','Personal recalibration', `Estimates shifted ${S.calib - before > 0 ? '+' : ''}${S.calib - before} points (total ${S.calib})`); runAssessment(); }
  log('ai','Outcome feedback', kind);
  const hit = kind === 'miss' ? miss : beat;
  const names = hit.map(x => school(x.id).short).join(' and '), chanceTxt = hit.map(x => x.c + '%').join(' and ');

    .filter(x => x.t.b.id === want && !x.t.cf.low).sort((a,b) => kind === 'miss' ? Math.abs(a.t.c-70) - Math.abs(b.t.c-70) : b.t.c - a.t.c).slice(0, 2);
  const on = new Set(r2.map(x => x.id));
  const draw = () => {
    overlay(`<div class="sheet" role="dialog">${sheetHd('Your results')}<div class="sheet-body">
      <div class="lc-icon ${kind}">${ic(kind === 'beat' ? 'trophy' : kind === 'miss' ? 'flag' : 'check', 2)}</div>
      <h2 class="h2" style="font-size:21px">${esc(fb.title)}</h2>
      <p class="p" style="margin-top:6px">${esc(fill(fb.body, {schools:names, chance:chanceTxt, step}))}</p>
      ${r2.length ? `<div class="h3" style="margin-top:20px">${esc(fb.r2)}</div><div class="lc-list">${r2.map(x => { const sc = school(x.id); return `<button class="lc-row" data-r2="${x.id}" aria-pressed="${on.has(x.id)}"><span class="th">${schoolArt(sc)}</span><span class="t"><b>${esc(sc.name)}</b><span><em class="tg2 ${x.t.b.id}">${x.t.b.label}, ${x.t.c}%</em> ${esc(sc.location)}</span></span><span class="cbx">${ic('check',3)}</span></button>`; }).join('')}</div>
        <button class="btn" id="r2-add" style="margin-top:18px">${esc(fb.cta)}</button>` : ''}
      ${planMsgs.length ? `<p class="evid" style="margin-top:16px">${ic('grid',2)}<span>${esc(planMsgs.join(' '))}</span></p>` : ''}
      <p class="evid" style="margin-top:16px">${ic('users',2)}<span>${esc(F.thanks)}</span></p>
      <button class="btn soft" id="r2-done" style="margin-top:14px">Done</button></div></div>`);
    document.querySelectorAll('[data-r2]').forEach(b => b.onclick = () => { on.has(b.dataset.r2) ? on.delete(b.dataset.r2) : on.add(b.dataset.r2); draw(); });

function diagnosis(){
  const D = SIM.diagnosis, n = norm(S.profile), sel = S.selected.map(school), gaps = [...D.gaps];
  const below = n.gmat === null ? 0 : sel.filter(s => n.gmat < s.gmat).length;
  if (n.gmat === null) gaps.unshift(D.no_score_gap);
  else if (sel.length && below * 2 >= sel.length) gaps.unshift({...D.low_score_gap, text: fill(D.low_score_gap.text, {gmat:n.gmat, n:below, count:sel.length})});
  const gl = D.goal_lines[S.profile.goal]; if (gl) gaps.push(gl);
  return { headline:D.headline, strengths:D.strengths, gaps, story:D.lead_story };
}

/* ===== simulated AI: action plan. Each date is the school's deadline minus days_before (SIM.plan.actions). ===== */
const dISO = d => d.toISOString().slice(0,10);
const dAdd = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return dISO(d); };
const dFmt = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const reqText = s => { const Q = s.requirements; return fill(SIM.plan.requires, {list:[plural(Q.recommenders, 'recommender'), plural(Q.essays.length, 'essay'), ...Q.extras.map(x => SIM.plan.extras[x].label)].join(', ')}); };
function buildPlan(){
  const P = SIM.plan, n = norm(S.profile), band = SIM.fit_rules.near_median_band, old = S.plan || {}; S.plan = {};
  S.selected.forEach(id => {
    const s = school(id), prev = old[id] || [], cond = { gmat_missing: n.gmat === null, gmat_below: n.gmat !== null && n.gmat - s.gmat <= -band };
    const Q = s.requirements, v = {school:s.name, short:s.short, median:s.gmat, recommenders:plural(Q.recommenders, 'recommender')}, acts = [];
    const add = (a, extra) => acts.push({key:a.key, title:fill(a.title, v), date:dAdd(s.deadline, -a.days_before), assistant:a.assistant, done:false, ...extra});
    P.actions.filter(a => !a.only_if || cond[a.only_if]).forEach(a => {
      if (a.repeat !== 'essays') return add(a);
      const n = Q.essays.length;      // one item per essay, the first due earliest
      Q.essays.forEach((e, i) => add({...a, key: i ? a.key + (i + 1) : a.key, title: n === 1 ? a.title_single : fill(a.title, {i:i + 1, n}), days_before: a.days_before + (n - 1 - i) * a.stagger_days}, {prompt:e.prompt, words:e.words}));
    });
    Q.extras.forEach(x => add({...P.extras[x], key:x}));
    acts.forEach(a => { const p = prev.find(x => x.key === a.key); if (p) a.done = p.done; });       // keep checked-off items
    prev.filter(p => p.added && !acts.some(a => a.key === p.key)).forEach(p => acts.push(p));          // keep items added by a status
    S.plan[id] = acts.sort((a,b) => a.date.localeCompare(b.date));
  });
  log('ai','Action plan built', `${S.selected.length} schools, ${Object.values(S.plan).flat().length} dated items`);
}
/* What a saved status does to that school's plan (SIM.plan.status_updates). Returns the message to show. */
function planStatus(id, o){
  const U = SIM.plan.status_updates[o], s = school(id), list = S.plan[id]; if (!U || !list) return '';
  if (U.complete) { const a = list.find(x => x.key === U.complete); if (a) a.done = true; }
  if (U.add_action && !list.some(x => x.key === U.add_action.key)) { const a = U.add_action;
    list.push({key:a.key, title:fill(a.title, {school:s.name, short:s.short}), date:dAdd(dISO(new Date()), a.days_from_today || 0), assistant:a.assistant, done:false, added:true});
    list.sort((x,y) => x.date.localeCompare(y.date)); log('ai','Plan item added', `${s.short}: ${fill(a.title, {school:s.name, short:s.short})}`); }
  if (U.celebrate) S.admitId = id;
  return fill(U.message, {school:s.name, short:s.short, date:dFmt(dAdd(s.deadline, SIM.plan.invite_days_after_deadline))});
}
/* Share of a school's plan items checked off. Drives the meter on each row of My list. */
function planPct(id){ const acts = S.plan[id] || [], k = acts.filter(a => a.done).length, n = acts.length; return {k, n, pct: n ? Math.round(k / n * 100) : 0}; }
function planTeaser(s){

  const k = acts.filter(a => a.done).length, nx = acts.find(a => !a.done), v = {short:s.short, k, n:acts.length, next: nx ? `${nx.title}, ${dFmt(nx.date)}` : ''};

    <button class="btn soft" id="toplan" style="margin-top:12px;height:46px;font-size:14px">${ic('grid',2)}${esc(fill(P.school_cta, v))}</button></div>`;
}

const planSec = (id, bare) => { const P = SIM.plan, s = school(id), acts = S.plan[id], t = tierOf(s, S.profile); return `<section class="bucket plansec ${bare === true ? 'bare' : ''}"><div class="orow-hd"><span class="th">${schoolArt(s)}</span><div><b>${esc(s.name)}${statusChip(id)}</b><span class="cap"><em class="tg2 ${t.b.id}">${t.b.label}</em> ${esc(fill(P.deadline, {date:dFmt(s.deadline)}))}, ${esc(fill(P.progress, {k:acts.filter(a => a.done).length, n:acts.length}))}</span></div></div>

const ago = m => m < 1 ? 'now' : m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m/60)}h` : `${Math.round(m/1440)}d`;
const listIds = () => S.selected.length && S.results ? S.selected : [];
const onList = t => t.school && listIds().includes(t.school);
const score = (base, key) => base + (comm().votes[key] || 0);
/* Ranking. Hot: votes decayed by age (Reddit style). New: newest first. Top: most votes.
   For you: Hot, boosted for schools on the user's list and for threads matching their profile. */
function userTags(){
  const p = S.profile, me = comm().me, t = new Set();
  if (p.industry) t.add(p.industry);
  if (!p.score) t.add('test');
  if (p.gpaScale === '10' || (me && me.country && me.country !== 'United States')) t.add('international');
  return t;
}
function whyForYou(t){
  if (onList(t)) return `Because ${school(t.school).short} is on your list`;
  const ut = userTags(), m = (t.tags || []).find(x => ut.has(x)); if (!m) return '';
  const ind = SIM.industries.find(i => i.id === m);
  return m === 'international' ? 'Popular with international applicants' : m === 'test' ? 'For applicants still preparing for the test' : `Popular with ${ind ? ind.label.toLowerCase() : m} applicants`;
}
function rank(arr){
  const c = comm(), R = SIM.community.ranking, ut = userTags();
  const hot = t => score(t.votes,t.id) / Math.pow(t.mins/60 + 2, R.hot_gravity) * (t.live ? R.live_boost : 1);
  const fy = t => hot(t) * (onList(t) ? R.list_boost : 1) * ((t.tags||[]).some(x => ut.has(x)) ? R.profile_boost : 1) * (t.mins > R.foryou_max_age_mins ? .2 : 1);
  const sorters = { hot:(a,b) => hot(b) - hot(a), new:(a,b) => a.mins - b.mins, top:(a,b) => score(b.votes,b.id) - score(a.votes,a.id), foryou:(a,b) => fy(b) - fy(a) };
  return [...arr].sort(sorters[c.sort]);
}
function voteBox(key, base, size=''){
  const v = comm().votes[key] || 0;
  return `<span class="vote ${size}" data-vkey="${key}"><button data-v="1" aria-label="Upvote" aria-pressed="${v===1}">${ic('up',1.8)}</button><b>${score(base,key)}</b><button data-v="-1" aria-label="Downvote" aria-pressed="${v===-1}">${ic('dn',1.8)}</button></span>`;
}

    log('user', c.votes[key] === 0 ? 'Removed vote' : d > 0 ? 'Upvoted' : 'Downvoted', describe(key));

      <div class="h3" style="margin-top:20px">Result</div><div class="tiles" style="grid-template-columns:1fr 1fr 1fr">${C.share_results.map(r => `<button class="tile" data-res="${r.id}" aria-pressed="${d.result===r.id}" style="min-height:64px;justify-content:center"><span>${esc(r.label)}</span></button>`).join('')}</div>
      <div class="h3" style="margin-top:24px">How do you want to share?</div>
      <div class="vis">${D.options.map(o => `<button class="visopt" data-vis="${o.id}" aria-pressed="${d.visibility===o.id}"><span class="radio"></span><span><b>${esc(o.label)}</b><span class="cap">${esc(o.sub)}</span></span></button>`).join('')}</div>
      ${d.visibility === 'details' ? `<div class="details">
        <div class="row2" style="margin-top:0"><label class="sel"><span>Country</span><select id="sh-c">${opt(D.countries, d.country)}</select></label>
          <label class="sel"><span>Gender</span><select id="sh-g">${opt(D.genders, d.gender)}</select></label></div>
        <label class="sel" style="display:block;margin-top:10px"><span>Prior industry</span><select id="sh-i"><option value="">Prefer not to say</option>${SIM.industries.map(i => `<option value="${i.id}" ${i.id===d.industry?'selected':''}>${esc(i.label)}</option>`).join('')}</select></label>
        <label class="check"><input type="checkbox" id="sh-s" ${d.stats?'checked':''}><span>${esc(D.stats_label)}</span></label>
        <div class="flairprev"><span class="cap">Others will see</span><b id="fp">${esc(preview())}</b></div>
        <p class="cap" style="margin-top:10px">${ic('info',2)}${esc(D.fairness_note)}</p></div>` : ''}
      <button class="btn" id="ssend" style="margin-top:24px">${d.visibility === 'details' ? esc(D.post_cta) : esc(D.anon_cta)}</button></div></div>`);
    document.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => { snap(); d.round = b.dataset.rd; draw(); });
    document.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { snap(); d.result = b.dataset.res; draw(); });

    $('#ssend').onclick = () => {
      snap(); const c = comm(), sc = school(d.school), res = C.share_results.find(r => r.id === d.result).label; c.outcomes++;
      let t = c.threads.find(x => x.school === d.school && x.tracker);
      const home = t || [...c.threads].filter(x => x.school === d.school && x.topic === 'invites').sort((a,b) => a.mins - b.mins)[0];

      log('data','Outcome reported (training label)', {school:sc.short, round:d.round, result:d.result, gmat_equiv:n.gmat ?? '(blank)', years:S.profile.years || '(blank)', industry: ind ? ind.label : '(blank)'});
      if (d.visibility === 'details'){

        const text = fill(D.result_comment, {result:res, round:d.round, school:sc.short});
        t = home;
        if (!t){ t = {id:'u'+(c.posted++), school:d.school, topic:'invites', title:`${sc.short} ${d.round}: ${res}`, body:text, author:'you', flair:myFlair(), mins:0, votes:1, comments:[], mine:true, tags:[], tracker:{invites:d.result==='invite'?1:0, noinvite:d.result==='noinvite'?1:0, waiting:d.result==='waiting'?1:0}}; c.threads.unshift(t); }
        else t.comments.push({author:'you', flair:myFlair(), mins:0, votes:1, text, mine:true, result:d.result, k:'m'+(c.posted++)});
        closeOverlay(); S.threadId = t.id; go('thread'); toast(D.posted_toast,'users');
      } else { closeOverlay(); render(); toast(fill(C.share_thanks,{members:C.stats.members}),'users'); }
    };
  };
  draw(); log('user','Opened share a result', defId ? school(defId).short : '');

/* Live Essay Coach: essay_server.py holds the API keys and calls the model through LiteLLM, so the
   provider is a setting (Anthropic, OpenAI, DeepSeek, Gemini). Without the server or without any key
   (plain http.server, the offline file) the Essay Coach keeps the keyword replies from simulated_responses.json. */
const LLM = {live:false, models:[], model:''};
const llmName = () => (LLM.models.find(m => m.id === LLM.model) || {}).label || LLM.model;
async function checkLLM(){
  if (location.protocol === 'file:') return;
  try { const r = await fetch('api/essay/status', {cache:'no-store'}); if (!r.ok) return; const j = await r.json();
    LLM.models = j.models || []; LLM.live = LLM.models.some(m => m.ready); const keep = LLM.models.find(m => m.id === LLM.model && m.ready);
    LLM.model = keep ? keep.id : ((LLM.models.find(m => m.id === j.default && m.ready) || LLM.models.find(m => m.ready) || {}).id || '');
    log('data','Essay Coach mode', LLM.live ? `Live (${llmName()})` : 'Simulated (server has no API keys)'); if (S.screen === 'work' || S.pane === 'work') render(); } catch(e){}
}
const b64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
/* What the coach knows about the candidate: the same profile fields the fit model and advice use. */
function coachProfile(){
  const p = S.profile, ind = SIM.industries.find(i => i.id === p.industry), g = SIM.career_goals.find(x => x.id === p.goal);
  return {name:p.name, test:p.score ? `${p.test.toUpperCase()} ${p.score}` : '', gpa:p.gpa ? `${p.gpa} of ${p.gpaScale}` : '', experience:p.years ? `${p.years} years` : '',
    industry:ind ? ind.label : '', focus_areas:labelsOf(SIM.focus_areas, p.focus || []), career_goal:g ? g.label : '', sponsored:p.sponsor === 'yes' ? 'yes' : '',
    legacy:p.legacy === 'yes' && p.legacySchool ? school(p.legacySchool).name : '', positioning_advice:SIM.diagnosis.lead_story};
}
/* Sends the conversation to essay_server.py and streams the reply into msg. */
async function coachReply(ck, ctx, msg, redraw){
  const W = SIM.assistants, up = S.uploads[ck];
  const history = S.chats[ck].filter(m => m !== msg && !m.err).map(m => ({role:m.who === 'me' ? 'user' : 'assistant', text:m.text}));
  msg.model = LLM.model;
  try {
    const r = await fetch('api/essay/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...ctx, model:LLM.model, profile:coachProfile(), doc:up && up.data ? {name:up.name, data:up.data} : null, history})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) { const {value, done} = await rd.read(); if (done) break; buf += dec.decode(value, {stream:true});
      let i; while ((i = buf.indexOf('\n\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 2); if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.t) { msg.text += ev.t; msg.wait = false; redraw(); }
        if (ev.error) throw new Error(ev.error); } }
    if (!msg.text) throw new Error('Empty reply');
  } catch(e) { msg.err = true; msg.text = (msg.text ? msg.text + '\n\n' : '') + fill(W.live.error, {error:e.message}); }
  msg.wait = false; msg.llm = true; redraw();
  log('ai', `Essay Coach reply (${msg.err ? 'error, ' : ''}${msg.model})`, msg.text);
  log('data','Coaching exchange captured (training data)', {school:ctx.short, item:ctx.item, model:msg.model, draft:up ? up.name : null, reply_words:(msg.text.match(/\S+/g) || []).length});
}
async function loadSim(){
  const t0 = $('#sim-inline').textContent.trim();
  if (location.protocol === 'file:' && t0) return JSON.parse(t0);
  try { const r = await fetch('simulated_responses.json', {cache:'no-store'}); if (!r.ok) throw 0; return await r.json(); }
  catch(e){ const t = $('#sim-inline').textContent.trim(); if (t) return JSON.parse(t); throw e; }
}
loadSim().then(d => { SIM = d; drawTestMode(); render(); log('data','Session started','Simulated responses loaded'); checkLLM(); })
  .catch(() => { V().innerHTML = `<div class="emptystate"><h1 class="h2">Responses file not found</h1><p class="p">Run python3 -m http.server in this folder, or open admit_pal_prototype.html.</p></div>`; });
